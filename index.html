  <style>
    /* =====================================================================
       1. DESIGN TOKENS & CSS VARIABLES (ESTUDIO MODERNO + ESCENARIO LIMPIO)
       ===================================================================== */
    :root {
      --primary: #b45309;
      --primary-hover: #92400e;
      --primary-soft: rgba(180, 83, 9, 0.12);
      --primary-border: rgba(180, 83, 9, 0.34);
      --primary-contrast: #ffffff;

      --bg: #f3f4f8;
      --surface: #ffffff;
      --surface-2: #eceef4;
      --surface-glass: rgba(255, 255, 255, 0.86);
      --border: rgba(15, 23, 42, 0.09);
      --text: #0f172a;
      --text-muted: #5b6475;

      --danger: #e11d48;
      --danger-soft: rgba(225, 29, 72, 0.11);
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.14);
      --shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.07), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-float: 0 12px 32px -6px rgba(15, 23, 42, 0.16);
      --radius: 18px;
      --radius-sm: 12px;
      --header-h: 62px;
      --nav-h: 72px;
    }

    body.dark {
      --bg: #090c12;
      --surface: #121722;
      --surface-2: #1a2130;
      --surface-glass: rgba(18, 23, 34, 0.84);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.48);
      --shadow-float: 0 16px 38px -6px rgba(0, 0, 0, 0.65);
    }

    /* =====================================================================
       2. BASE RESET & RESPONSIVE SHELL
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 0%, var(--primary-soft) 0%, transparent 42%),
        radial-gradient(circle at 92% 18%, var(--primary-soft) 0%, transparent 36%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.48;
      overscroll-behavior-y: none;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    button:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #app-shell {
      min-height: 100vh;
      max-width: 960px;
      margin: 0 auto;
      padding-top: calc(var(--header-h) + 4px);
      padding-bottom: calc(var(--nav-h) + 28px);
      transition: padding 0.2s ease;
    }

    body.immersive-fs .bottom-nav {
      display: none !important;
    }
    body.immersive-fs #app-shell {
      padding-bottom: 24px;
      max-width: 1120px;
    }

    /* =====================================================================
       3. GLASSMORPHISM TOP BAR
       ===================================================================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar-inner {
      width: 100%;
      max-width: 960px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: #0e192f;
      border: 1.5px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 0;
      box-shadow: 0 4px 12px var(--primary-soft);
      transition: transform 0.14s ease, border-color 0.15s ease;
    }

    .brand-icon:active {
      transform: scale(0.93);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      display: inline-block;
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      font-weight: 800;
      margin-top: -1px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .top-btn {
      height: 36px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.77rem;
      font-weight: 700;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .top-btn:hover {

    /* BARRA ÚNICA DE HERRAMIENTAS */
    .unified-tools-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 80; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.10); }
    .unified-tools-wrap { max-width: 920px; margin: 0 auto; position: relative; }
    .unified-tools-toggle { width: 100%; min-height: 48px; border: 1px solid var(--primary-border); border-radius: 14px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-weight: 800; font-size: .94rem; cursor: pointer; }
    .unified-tools-toggle .toggle-left { display: flex; align-items: center; gap: 10px; }
    .unified-tools-toggle .toggle-arrow { transition: transform .18s ease; }
    .unified-tools-toggle[aria-expanded="true"] .toggle-arrow { transform: rotate(180deg); }
    .unified-tools-menu { display: none; position: absolute; bottom: calc(100% + 10px); left: 0; right: 0; max-height: min(68vh, 560px); overflow: auto; border: 1px solid var(--border); border-radius: 18px; padding: 12px; background: var(--surface); box-shadow: 0 18px 45px rgba(0,0,0,.22); }
    .unified-tools-menu.open { display: block; }
    .tool-menu-section + .tool-menu-section { border-top: 1px solid var(--border); margin-top: 9px; padding-top: 10px; }
    .tool-menu-title { font-size: .7rem; font-weight: 900; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px 8px; }
    .tool-menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .tool-menu-btn { min-height: 47px; display: flex; align-items: center; gap: 9px; text-align: left; border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; background: var(--surface); color: var(--text); font-weight: 750; cursor: pointer; }
    .tool-menu-btn:active { transform: scale(.98); }
    .tool-menu-btn .tool-icon { font-size: 1.22rem; width: 25px; text-align: center; }
    .tool-menu-btn .tool-sub { display: block; font-size: .68rem; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    .tool-menu-btn.active-tool { border-color: var(--primary-border); background: var(--primary-soft); color: var(--primary); }
    .tool-menu-btn.wide { grid-column: 1 / -1; }
    body { padding-bottom: 88px !important; }
    @media (max-width: 420px) { .unified-tools-nav { padding-left: 8px; padding-right: 8px; } .tool-menu-grid { gap: 6px; } .tool-menu-btn { padding: 8px; min-height: 44px; font-size: .82rem; } }

    /* ENSAYO HUB - UI compacta y expansible */

    .ensayo-hub-grid { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
    .ensayo-module { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
    .ensayo-module summary { list-style: none; display: grid; grid-template-columns: 42px minmax(0,1fr) 24px; align-items: center; gap: 10px; padding: 12px; cursor: pointer; min-height: 62px; }
    .ensayo-module summary::-webkit-details-marker { display: none; }

    /* =====================================================================
       4. SHARED COMPONENTS & PILL CONTROLS
       ===================================================================== */

      display: flex;
      flex-direction: column;
      gap: 15px;

    }

    @keyframes viewFade {

    }

    .card {

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 17px;
      box-shadow: var(--shadow);
    }

      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;

    }

    .btn {

      justify-content: center;
      gap: 6px;
      padding: 9px 16px;

      font-size: 0.84rem;
      font-weight: 700;
      min-height: 40px;

    }

    .btn-primary {

    .btn-soft {

      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-whatsapp {

      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .btn-danger {

      color: var(--danger);
      border: 1px solid rgba(225, 29, 72, 0.30);
    }

    .btn-danger-solid {
      background: var(--danger);
      color: #ffffff;

    .btn-sm {

    }

    .btn-lg {
      padding: 12px 20px;

    .input, .select, .textarea {

      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {

      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .textarea {

      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .field-label {
      display: block;
      font-size: 0.71rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    input[type="range"] {

      cursor: pointer;
    }

    .segmented {
      display: grid;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;

    .seg-btn {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);

      text-align: center;
      white-space: nowrap;
    }

    .seg-btn.active {
      background: var(--primary);
      color: var(--primary-contrast);
      box-shadow: 0 3px 10px -2px var(--primary-border);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .badge-neutral {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .info-notice {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);

    .admin-banner {

      align-items: center;
      justify-content: space-between;

    .divider {

    /* =====================================================================
       5. CANTORAL & LISTAS CARDS
       ===================================================================== */
    .song-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: transform 0.14s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .song-card:hover {
      border-color: var(--primary-border);
      transform: translateY(-1px);
    }

    .song-card-main {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .song-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .song-card-title {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 5px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .mini-icon-btn {
      width: 35px;
      height: 35px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .mini-icon-btn:hover {
      border-color: var(--primary-border);
      color: var(--primary);
    }

    .mini-icon-btn:active { transform: scale(0.92); }

    .mini-icon-btn.danger:hover {
      background: var(--danger-soft);
      border-color: rgba(225, 29, 72, 0.35);
      color: var(--danger);
    }

    /* Horizontal Lists Selector */
    .lists-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .list-tab-card {
      flex-shrink: 0;
      min-width: 165px;
      max-width: 235px;
      padding: 12px 15px;
      border-radius: 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      text-align: left;
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
    }

    .list-tab-card:active { transform: scale(0.97); }

    .list-tab-card.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface) 100%);
    }

    .list-tab-title {
      font-weight: 800;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .list-tab-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .picker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
    }

    .picker-item.checked {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .picker-item input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 28px 18px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 0.88rem;
      background: var(--surface);

    /* =====================================================================
       6. VISOR, 1/2 COLUMNS, CHORD ALIGNMENT & DIRECTION NOTES
       ===================================================================== */
    .visor-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .control-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .direction-box {
      background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface) 100%);
      border: 1px solid var(--primary-border);
      border-left: 4px solid var(--primary);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.84rem;
      box-shadow: var(--shadow);
    }

    .audio-ref-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: var(--shadow);
    }

    .sheet-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      min-height: 45vh;
      box-shadow: var(--shadow);
    }

    .two-cols {
      column-count: 2;
      column-gap: 28px;
      column-rule: 1px solid var(--border);
    }

    .stanza-block {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 1.1em;
    }

    .stanza-block:last-child { margin-bottom: 0; }

    .lyric-line {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 0.46em;
      line-height: 1.44;
      min-height: 1.25em;
    }

    .lyric-seg {
      display: inline-flex;
      flex-direction: column;
      justify-content: flex-end;
      vertical-align: bottom;
      white-space: pre;
    }

    .chord-tag {
      color: var(--primary);
      font-weight: 800;
      font-size: 0.84em;
      line-height: 1.15;
      padding: 2px 6px;
      margin-right: 0.22em;
      margin-bottom: 0.12em;
      border-radius: 7px;
      display: inline-block;
      align-self: flex-start;
      transition: background-color 0.12s ease, transform 0.1s ease;

    .chord-tag.clickable {
      cursor: pointer;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
    }

    .chord-tag.clickable:hover,
    .chord-tag.clickable:active {
      background: var(--primary);
      color: var(--primary-contrast);
      transform: scale(1.05);

    .lyric-section-hdr {
      display: inline-block;
      font-size: 0.72em;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 0.42em;

      min-height: auto;

      display: inline;
      white-space: normal;
    }

    .no-chords .stanza-block { margin-bottom: 0.85em; }

    }

      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .atril-section-nav {
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      padding:7px 14px; background:rgba(15,20,30,.94);
      border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;
    }
    .atril-section-nav label { color:#aeb8c8; font-size:.72rem; font-weight:700; }
    .atril-section-nav select {
      flex:1; min-width:150px; max-width:360px; padding:7px 10px;
      border-radius:9px; color:#f3f4f6; background:#1a2130;
      border:1px solid #354158; font-size:.78rem;
    }
    #atril-overlay .lyric-section-hdr { scroll-margin-top:18px; }
    #atril-overlay .lyric-section-hdr.atril-section-active {
      outline:2px solid var(--primary); outline-offset:4px;
    }
    .atril-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px 140px;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }

    #atril-overlay .chord-tag {
      color: var(--primary);
      filter: brightness(1.32);
    }

    #atril-overlay .lyric-section-hdr {
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
    }
    #atril-overlay .two-cols { column-rule-color: #252d3c; }

    .atril-btn {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #1a2130;
      color: #f3f4f6;
      border: 1px solid #2e384d;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .atril-btn.active-atril {
      background: var(--primary);
      color: var(--primary-contrast);
      border-color: var(--primary);
    }

    /* Atril Inteligente 2.0: navegación táctil entre cantos */
    #atril-list-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px !important;
      width: 100%;
      padding: 5px 8px 7px;
    }
    #atril-list-nav .atril-btn {
      min-height: 42px;
      min-width: 116px;
      justify-content: center;
      padding: 9px 14px;
      font-size: .82rem;
      touch-action: manipulation;
    }
    #atril-list-nav .atril-btn:disabled {
      opacity: .38;
      cursor: not-allowed;
    }
    #atril-list-pos {
      min-width: 48px;
      text-align: center;
      font-size: .82rem !important;
      color: #e2e8f0 !important;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      #atril-list-nav { gap: 7px !important; }
      #atril-list-nav .atril-btn {
        min-width: 0;
        flex: 1;
        min-height: 46px;
        padding: 10px 8px;
      }
    }

    /* Atril Inteligente 1.0: lectura y desplazamiento accesibles */
    .atril-reading-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px 2px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .atril-reading-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .atril-reading-actions input[type="range"] {
      flex: 1;
      min-width: 55px;
      accent-color: var(--primary);
      touch-action: pan-x;
    }
    .atril-speed-caption, #atril-scroll-speed-val {
      color: #cbd5e1;
      font-size: .76rem;
      white-space: nowrap;
    }
    #atril-scroll-speed-val { min-width: 14px; text-align: center; }
    .atril-reading-hint {
      color: #94a3b8;
      font-size: .68rem;
      padding-left: 2px;
    }
    #atril-overlay .atril-scroll-area {
      scroll-behavior: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    #atril-overlay #atril-sheet {
      line-height: 1.72;
      letter-spacing: .01em;
      padding-bottom: 48px;
    }
    #atril-overlay #atril-sheet .chord-tag {
      font-weight: 800;
      letter-spacing: .025em;
    }

    /* Atril 3.0: zoom táctil con dos dedos */
    /* Los gestos se gestionan en JavaScript para conservar scroll y pellizco. */
    #atril-overlay #atril-sheet { touch-action: none; transform-origin: top center; }
    #atril-overlay #atril-scroll-area { overscroll-behavior: contain; touch-action: none; }
    #atril-zoom-hint {
      display: block; text-align: center; color: #aeb9ca;
      font-size: .72rem; padding: 4px 8px 8px;
      user-select: none; pointer-events: none;
    }

    /* Atril 4.0: modo limpio para interpretación */
    #atril-overlay.atril-clean-mode .atril-bar,
    #atril-overlay.atril-clean-mode #atril-zoom-hint {
      display: none !important;
    }
    #atril-restore-controls {
      position: absolute;
      z-index: 5;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(20,27,39,.88);
      color: #fff;
      font-size: .78rem;
      font-weight: 700;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      touch-action: manipulation;
    }
    #atril-overlay.atril-clean-mode #atril-scroll-area {
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    #atril-overlay .atril-btn:disabled {
      opacity: .38;
      cursor: not-allowed;
    }
    @media (max-width: 600px) {
      .atril-bar { padding: 9px 9px 7px; gap: 7px; }
      .atril-bar .row-between { align-items: center; }
      .atril-bar .atril-btn { min-height: 36px; padding: 7px 9px; }
      .atril-reading-controls { padding: 7px 2px 1px; }
      .atril-reading-actions { gap: 7px; }
      .atril-reading-hint { display: none; }
      .atril-scroll-area { padding: 16px 13px 90px; }
    }
    /* Atril 4.3: indicador discreto de avance de lectura */
    #atril-progress-track {
      position: sticky;
      top: -1px;
      z-index: 4;
      width: 100%;
      height: 3px;
      margin: -12px 0 18px;
      border-radius: 99px;
      background: rgba(148,163,184,.18);
      overflow: hidden;
      pointer-events: none;
    }
    #atril-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width .12s linear;
    }
    #atril-overlay.atril-clean-mode #atril-progress-track {
      height: 2px;
      margin-top: -18px;
      opacity: .72;
    }
    @media (orientation: landscape) and (min-width: 700px) and (max-height: 900px) {
      #atril-progress-track { margin-top: -6px; margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .atril-bar { padding: 5px 10px; gap: 4px; }
      .atril-reading-controls { padding-top: 4px; }
      .atril-reading-hint { display: none; }
      .atril-scroll-area { padding-top: 10px; }
    }

    /* Atril 4.2: distribución optimizada para tablet en horizontal */
    @media (orientation: landscape) and (min-width: 700px) and (max-height: 900px) {
      #atril-overlay .atril-bar {
        padding: 6px 14px;
        gap: 5px;
      }
      #atril-overlay .atril-bar > .row-between:first-child {
        min-height: 34px;
      }
      #atril-overlay #atril-title {
        font-size: .96rem !important;
      }
      #atril-overlay .atril-bar > .row-between:nth-child(2) {
        align-items: center;
        flex-wrap: nowrap !important;
        gap: 12px !important;
      }
      #atril-overlay .atril-bar > .row-between:nth-child(2) > .row:first-child {
        flex-wrap: nowrap !important;
        gap: 6px !important;
      }
      #atril-overlay .atril-bar .atril-btn {
        min-height: 34px;
        padding: 6px 11px;
        white-space: nowrap;
      }
      #atril-overlay #atril-list-nav {
        width: auto;
        padding: 0;
        flex-shrink: 0;
      }
      #atril-overlay #atril-list-nav .atril-btn {
        min-width: 96px;
        min-height: 36px;
      }
      #atril-overlay .atril-reading-controls {
        padding: 3px 2px 0;
      }
      #atril-overlay .atril-reading-actions {
        min-height: 32px;
      }
      #atril-overlay .atril-reading-hint,
      #atril-overlay #atril-zoom-hint {
        display: none;
      }
      #atril-overlay .atril-scroll-area {
        max-width: 1400px;
        padding: 12px 28px 54px;
      }
      #atril-overlay.atril-clean-mode .atril-scroll-area {
        padding: 18px 34px 42px;
      }
    }

    @media (orientation: landscape) and (min-width: 700px) and (max-height: 520px) {
      #atril-overlay .atril-bar {
        padding: 4px 12px;
        gap: 3px;
      }
      #atril-overlay .atril-bar .atril-btn {
        min-height: 30px;
        padding: 4px 9px;
        font-size: .72rem;
      }
      #atril-overlay .atril-reading-actions {
        min-height: 27px;
      }
      #atril-overlay .atril-scroll-area {
        padding-top: 8px;
        padding-bottom: 36px;
      }
    }

    /* =====================================================================
       8. METRONOME, TUNER, TONES & RECORDER
       ===================================================================== */
    .beat-lights {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 14px 0;
    }

    .beat-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.1s ease, box-shadow 0.1s ease;
    }

    .beat-dot.accent-dot {
      border-color: var(--primary-border);
      color: var(--primary);
    }

    .beat-dot.lit {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-contrast);
      transform: scale(1.22);
      box-shadow: 0 0 18px var(--primary-border);
    }

    .bpm-big {
      font-size: 3.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tuner-note-big {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text-muted);
    }

    .tuner-note-big.in-tune { color: var(--success); }
    .tuner-note-big.off-tune { color: var(--primary); }

    .tuner-meter {
      position: relative;
      height: 36px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
      margin: 12px 0 6px;
    }

    .tuner-center-zone {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 46px;
      transform: translateX(-50%);
      background: var(--success-soft);
      border-left: 1px solid rgba(5, 150, 105, 0.35);
      border-right: 1px solid rgba(5, 150, 105, 0.35);
    }

    .tuner-center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: var(--success);
    }

    .tuner-needle {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 8px;
      border-radius: 999px;
      background: var(--primary);
      left: calc(50% - 4px);
      transition: left 0.08s linear;
    }

    .tone-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .tone-grid-12 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    @media (min-width: 560px) {
      .tone-grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .tone-grid-12 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    .tone-btn {
      padding: 10px 6px;
      border-radius: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.14s ease;
    }

    .tone-btn:hover { border-color: var(--primary-border); }

    .tone-btn.playing {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-contrast);
      box-shadow: 0 6px 16px -4px var(--primary-border);
    }

    .tone-btn .t-main { display: block; font-weight: 800; font-size: 0.92rem; }
    .tone-btn .t-sub { display: block; font-size: 0.66rem; opacity: 0.78; }

    .rec-canvas-wrap {
      width: 100%;
      height: 78px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .rec-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .rec-timer-txt {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 2rem;
      font-weight: 800;
    }

    .rec-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
    }

    .rec-pulse.live {
      background: var(--danger);
      animation: recBlink 1s infinite;
    }

    @keyframes recBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* =====================================================================
       9. MODALS, CHORD DIAGRAMS, SWATCHES & ADMIN PANEL
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: rgba(5, 8, 15, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-card {
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .swatch-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      text-align: left;
    }

    .swatch-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .swatch-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
    }

    .chord-quick-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }

    .chord-chip {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .chord-chip:active { transform: scale(0.93); }

    .diagram-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .admin-stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .admin-stat-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .admin-stat-lbl {
      font-size: 0.71rem;
      color: var(--text-muted);
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .pin-hint {
      font-size: 0.76rem;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 9px 11px;
    }

    /* =====================================================================
       10. FLOATING PILL BOTTOM NAVIGATION BAR (5 TABS)
       ===================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 8px;
      left: 10px;
      right: 10px;
      height: calc(var(--nav-h) - 8px);
      background: transparent;
      z-index: 40;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-nav-inner {
      pointer-events: auto;
      width: 100%;
      max-width: 620px;
      background: var(--surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-float);
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      font-size: 0.67rem;
      font-weight: 700;
      border-radius: 999px;
      position: relative;
      transition: background-color 0.16s ease, color 0.16s ease, transform 0.12s ease;
    }

    .nav-item:active {
      transform: scale(0.94);
    }

    .nav-item .nav-emoji {
      font-size: 1.12rem;
      line-height: 1.1;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .nav-badge-count {
      position: absolute;
      top: 4px;
      right: calc(50% - 21px);
      background: var(--primary);
      color: var(--primary-contrast);
      font-size: 0.59rem;
      font-weight: 800;
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* =====================================================================
       11. TOASTS & CLEAN PRINT / PDF
       ===================================================================== */
    #toast-wrap {
      position: fixed;
      top: calc(var(--header-h) + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 90%;
      max-width: 360px;
      pointer-events: none;
    }

    .toast {
      background: var(--text);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #print-sheet {
      display: none;
    }

    @media print {
      @page {
        size: letter portrait;
        margin: 1.2cm 1.3cm;
      }
      html, body {
        background: #ffffff !important;
        background-image: none !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #app-shell, .top-bar, .bottom-nav, #atril-overlay, #modal-backdrop, #toast-wrap, #splash-screen {
        display: none !important;
      }
      #print-sheet {
        display: block !important;
        color: #000000 !important;
        background: #ffffff !important;
        font-family: Arial, Helvetica, sans-serif;
      }
      #print-sheet h1 {
        font-family: Georgia, serif;
        font-size: 16pt;
        margin: 0 0 4pt;
        text-align: center;
        color: #000;
      }
      #print-sheet .p-meta {
        text-align: center;
        font-size: 9pt;
        color: #222;
        margin-bottom: 10pt;
        padding-bottom: 5pt;
        border-bottom: 1pt solid #000;
      }
      #print-sheet .p-notes {
        font-size: 8.6pt;
        font-style: italic;
        margin-bottom: 9pt;
        color: #222;
      }
      #print-sheet .p-body {
        font-size: 10.2pt;
        line-height: 1.35;
      }
      #print-sheet .two-cols {
        column-count: 2;
        column-gap: 20pt;
        column-rule: 0.5pt solid #ccc;
      }
      #print-sheet .chord-tag {
        color: #000000 !important;
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        font-weight: 800 !important;
        font-size: 8.8pt !important;
      }
      #print-sheet .lyric-section-hdr {
        color: #000000 !important;
        background: transparent !important;
        padding: 0 !important;
        font-size: 8.3pt !important;
      }
      #print-sheet .stanza-block {
        break-inside: avoid;
        margin-bottom: 8pt;
      }
      #print-sheet .p-list-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10pt;
        margin-top: 8pt;
      }
      #print-sheet .p-list-table th,
      #print-sheet .p-list-table td {
        border-bottom: 0.6pt solid #999;
        padding: 6pt 5pt;
        text-align: left;
      }
    }

    /* =====================================================================
       12. PANTALLA DE BIENVENIDA (SPLASH SCREEN)
       ===================================================================== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: radial-gradient(circle at center, #14264b 0%, #091122 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      cursor: pointer;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-img {
      width: min(290px, 74vw);
      height: auto;
